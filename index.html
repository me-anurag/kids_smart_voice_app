<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9206fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolo Bolo">
<title>Bolo Bolo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="mode-light">

<header id="topbar">
  <button id="menuBtn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div id="appName"><img src="icons/icon-192.png" alt="">Bolo Bolo</div>
  <div id="modeChip">💡 बत्ती</div>
</header>

<main id="stage">

  <!-- Light mode -->
  <section id="lightView" class="view">
    <div id="bulbWrap">
      <div id="bulb"></div>
      <div id="bulbBase"></div>
    </div>
  </section>

  <!-- Pictures mode -->
  <section id="pictureView" class="view" hidden>
    <div id="card">
      <div id="cardEmpty">
        <div class="bigEmoji">🦁🚀🌈</div>
        <div>किसी भी चीज़ का नाम बोलो!</div>
      </div>
      <div id="cardLoading" hidden>
        <div class="searchEmoji">🔍</div>
        <div>ढूँढ रहे हैं...</div>
      </div>
      <img id="photo" alt="" hidden>
      <h2 id="photoTitle" hidden></h2>
    </div>
  </section>

  <p id="bubble">नमस्ते! 👋</p>

  <div id="sound" hidden>
    🔊 <input id="volume" type="range" min="0" max="1" step="0.1" value="1">
  </div>

  <div id="hints"></div>
</main>

<footer id="bottom">
  <button id="talk" aria-label="बोलो">
    <span class="ring"></span>
    <span class="micIcon">🎤</span>
  </button>
  <div id="talkLabel">दबाओ और बोलो!</div>
</footer>

<!-- Slide-in menu -->
<div id="overlay" hidden></div>
<nav id="drawer" aria-hidden="true">
  <div id="drawerTitle">🌈 क्या खेलें?</div>
  <button class="tile" data-mode="light">
    <span class="tileEmoji">💡</span>
    <span class="tileName">बत्ती</span>
    <span class="tick">✔</span>
  </button>
  <button class="tile" data-mode="picture">
    <span class="tileEmoji">🖼️</span>
    <span class="tileName">तस्वीरें</span>
    <span class="tick">✔</span>
  </button>
  <div id="version"></div>
</nav>

<!-- Install popup: shown when the link is opened in the browser -->
<div id="installBox" hidden>
  <div id="installCard">
    <img src="icons/icon-192.png" alt="" id="installIcon">
    <div id="installTitle">Bolo Bolo</div>
    <div id="installText">फ़ोन में ऐप डालो और खेलो!</div>
    <button id="installBtn">📲 ऐप इंस्टॉल करो</button>
    <div id="installHelp" hidden></div>
    <button id="installLater">बाद में</button>
  </div>
</div>

<audio id="music" src="party.mp3" loop preload="none"></audio>

<script src="version.js"></script>
<script src="blocklist.js"></script>
<script src="app.js"></script>
</body>
</html>
