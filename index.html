<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9206fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolo Bolo">
<title>Bolo Bolo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="mode-welcome">

<!-- twinkling sparkles in the background -->
<div id="sky" aria-hidden="true">
  <i style="left:8%;top:14%"></i>
  <i style="left:88%;top:10%;animation-delay:.8s"></i>
  <i style="left:76%;top:34%;animation-delay:1.6s"></i>
  <i style="left:5%;top:46%;animation-delay:2.2s"></i>
  <i style="left:92%;top:58%;animation-delay:.4s"></i>
  <i style="left:14%;top:72%;animation-delay:1.2s"></i>
  <i style="left:58%;top:24%;animation-delay:2.6s"></i>
  <i style="left:84%;top:84%;animation-delay:1.9s"></i>
  <b style="left:-40px;top:22%"></b>
  <b style="right:-60px;top:62%;animation-delay:-4s"></b>
</div>

<!-- Home: pick what to play -->
<section id="home">
  <img src="icons/mascot-scene.png" alt="" id="homeMascot">
  <h1 id="homeTitle">Bolo Bolo</h1>
  <p id="homeSub">What do you want to play?</p>
  <div id="homeTiles">
    <button class="homeTile" data-mode="light">
      <span class="tileEmoji">💡</span>
      <span class="tileName">Lights</span>
    </button>
    <button class="homeTile" data-mode="picture">
      <span class="tileEmoji">🖼️</span>
      <span class="tileName">Pictures</span>
    </button>
    <button class="homeTile" data-mode="animals">
      <span class="tileEmoji">🐾</span>
      <span class="tileName">Animal Sounds</span>
    </button>
  </div>
  <button id="changeName">🔄 Change</button>
  <div id="homeFoot"><span id="version"></span> · <a href="credits.html">Credits</a></div>
</section>

<!-- Welcome: who is playing? -->
<section id="welcome" hidden>
  <img src="icons/mascot.png" alt="" id="welcomeBuddy">
  <p id="welcomeText">नमस्ते! अपना नाम बताइए। 👋</p>
  <div id="kidGrid"></div>
  <button id="skipName">Skip ▸</button>
</section>

<header id="topbar">
  <button id="homeBtn" aria-label="Home">🏠</button>
  <div id="appName"><img src="icons/icon-192.png" alt=""><span id="modeTitle">Lights</span></div>
</header>

<main id="stage">

  <!-- Light mode -->
  <section id="lightView" class="view">
    <div id="bulbWrap">
      <div id="rays"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div id="bulb"><div class="filament"></div></div>
      <div id="bulbBase"></div>
    </div>
  </section>

  <!-- Animal sounds -->
  <section id="animalView" class="view" hidden>
    <div id="animalGrid"></div>
  </section>

  <!-- Pictures mode -->
  <section id="pictureView" class="view" hidden>
    <div id="card">
      <div id="cardEmpty">
        <img src="icons/mascot-scene.png" alt="" class="scene">
        <div>किसी भी चीज़ का नाम बोलो!</div>
      </div>
      <div id="cardLoading" hidden>
        <div class="seeker">
          <img src="icons/mascot.png" alt="">
          <span>🔍</span>
        </div>
        <div>ढूँढ रहे हैं<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
      </div>
      <div id="polaroid" hidden>
        <span class="tape t1"></span>
        <span class="tape t2"></span>
        <div id="slides"><div id="track"></div></div>
        <h2 id="photoTitle"></h2>
        <img class="peek" src="icons/mascot.png" alt="">
        <div id="burst"></div>
      </div>
      <div id="dots" hidden></div>
    </div>
  </section>

  <div id="talkRow">
    <img id="buddy" src="icons/mascot.png" alt="">
    <p id="bubble">नमस्ते! 👋</p>
  </div>

  <div id="sound" hidden>
    🔊 <input id="volume" type="range" min="0" max="1" step="0.1" value="1">
  </div>

  <div id="hints"></div>
</main>

<footer id="bottom">
  <div id="micWrap">
    <span class="wave left w1"></span>
    <span class="wave left w2"></span>
    <button id="talk" aria-label="बोलो">
      <span class="ring"></span>
      <span class="micIcon">🎤</span>
    </button>
    <span class="wave right w1"></span>
    <span class="wave right w2"></span>
  </div>
  <div id="talkLabel">Tap and talk!</div>
</footer>

<!-- Install popup: shown when the link is opened in the browser -->
<div id="installBox" hidden>
  <div id="installCard">
    <img src="icons/mascot-scene.png" alt="" id="installIcon">
    <div id="installTitle">Bolo Bolo</div>
    <div id="installText">Add the app to your phone and play!</div>
    <button id="installBtn">📲 Install app</button>
    <div id="installHelp" hidden></div>
    <button id="installLater">Later</button>
  </div>
</div>

<audio id="music" src="party.mp3" loop preload="none"></audio>

<script src="version.js"></script>
<script src="blocklist.js"></script>
<script src="app.js"></script>
</body>
</html>
